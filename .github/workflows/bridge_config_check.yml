name: bridge_config_check
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Validate configs
        run: |
          python scripts/bridge_migrate_check.py
      - name: Enforce latest secret versions
        run: |
          python - <<'PY'
          import yaml, sys, pathlib
          p = pathlib.Path('bridge/accounts.yaml')
          data = yaml.safe_load(p.read_text(encoding='utf-8'))
          for aid, aconf in (data.get('accounts') or {}).items():
              for k in ('login_email_secret','email_secret','password_secret'):
                  v=(aconf or {}).get(k,'')
                  if isinstance(v,str) and '/versions/latest' not in v:
                      raise SystemExit(f"{aid}:{k} must use versions/latest -> {v}")
          print('secrets OK')
          PY
